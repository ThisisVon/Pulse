<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">

    <div class="pulse-logo">
        Pulse
    </div>

</div>





<div class="app">





<!-- HOME -->

<section class="page active-page" id="home">


<div class="player">


<div class="album">

<img id="album-cover" src="" alt="">

</div>



<h2 id="song-title">
Song Name
</h2>


<p id="artist-name">
Artist Name
</p>





<div class="time-row">

<span id="current-time">
0:00
</span>


<span id="duration">
3:30
</span>


</div>





<div class="progress">


<input

class="progress-bar"

type="range"

min="0"

max="210"

value="0"

>


</div>







<div class="controls">



<button class="skip back">


<svg viewBox="0 0 24 24">

<path d="M15 5L7 12L15 19Z"/>

</svg>


</button>







<button class="play-button">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M8 5V19L19 12L8 5Z"/>

</svg>





<svg class="pause-icon" viewBox="0 0 24 24">


<rect x="7" y="5" width="4" height="14" rx="2"/>

<rect x="13" y="5" width="4" height="14" rx="2"/>


</svg>


</button>







<button class="skip forward">


<svg viewBox="0 0 24 24">


<path d="M9 5L17 12L9 19Z"/>


</svg>


</button>




</div>


<div class="volume">

<input

class="volume-bar"

type="range"

min="0"

max="100"

value="75"

>

</div>


</div>


</div>


</section>







<!-- EXPLORE -->


<section class="page" id="explore">


<h1>
Explore
</h1>


<div class="music-results" id="explore-results">

</div>


</section>








<!-- SEARCH -->


<section class="page" id="search">


<h1>
Search
</h1>



<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M14 14L21 21"/>

</svg>



<input 
id="search-input"
placeholder="Search songs, artists..."
>


</div>




<div class="music-results" id="search-results">

</div>



</section>








<!-- LIBRARY -->


<section class="page" id="library">


<h1>
Library
</h1>



<div class="music-card">


<h3>
Your Music
</h3>


<p>
Your saved songs appear here
</p>


</div>



</section>










<!-- NAV -->


<nav>



<button class="active">


<svg viewBox="0 0 24 24">

<path d="M3 11L12 3L21 11"/>

<path d="M5 10V21H19V10"/>

</svg>


<span>
Home
</span>


</button>







<button>


<svg viewBox="0 0 24 24">


<path d="M12 3L14 9L21 12L14 15L12 21L10 15L3 12L10 9Z"/>


</svg>


<span>
Explore
</span>


</button>







<button>


<svg viewBox="0 0 24 24">


<circle cx="10" cy="10" r="6"/>

<path d="M14 14L21 21"/>


</svg>


<span>
Search
</span>


</button>







<button>


<svg viewBox="0 0 24 24">


<path d="M9 18V5L20 3V16"/>

<circle cx="6" cy="18" r="3"/>

<circle cx="17" cy="16" r="3"/>


</svg>


<span>
Library
</span>


</button>




</nav>






</div>





<script src="script.js"></script>


</body>

</html>
