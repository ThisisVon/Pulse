<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">

    <div class="pulse-logo">
        Pulse
    </div>

</div>



<div class="app">



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>



<div class="progress">
<div></div>
</div>




<div class="controls">


<button class="skip">

<svg viewBox="0 0 24 24">
<path d="M11 5L2 12L11 19V5Z"/>
<path d="M22 5L13 12L22 19V5Z"/>
</svg>

</button>





<button class="play-button">

<svg class="play-icon" viewBox="0 0 24 24">
<path d="M8 5V19L19 12L8 5Z"/>
</svg>


<svg class="pause-icon hidden-icon" viewBox="0 0 24 24">
<rect x="6" y="5" width="4" height="14" rx="2"/>
<rect x="14" y="5" width="4" height="14" rx="2"/>
</svg>


</button>





<button class="skip">

<svg viewBox="0 0 24 24">
<path d="M13 5L22 12L13 19V5Z"/>
<path d="M2 5L11 12L2 19V5Z"/>
</svg>

</button>


</div>


</div>


</section>





<section class="page" id="explore">

<h1>Explore</h1>


<div class="music-card">

<h3>Trending Now</h3>

<p>Discover new music</p>

</div>



<div class="music-card">

<h3>Recommended</h3>

<p>Made for you</p>

</div>


</section>







<section class="page" id="search">

<h1>Search</h1>


<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M14 14L21 21"/>

</svg>



<input placeholder="Search songs, artists...">


</div>


</section>







<section class="page" id="library">

<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>







<nav>


<button class="active">

<svg viewBox="0 0 24 24">
<path d="M3 11L12 3L21 11"/>
<path d="M5 10V21H19V10"/>
</svg>

<span>Home</span>

</button>




<button>

<svg viewBox="0 0 24 24">
<path d="M12 3L14.5 9.5L21 12L14.5 14.5L12 21L9.5 14.5L3 12L9.5 9.5Z"/>
</svg>

<span>Explore</span>

</button>




<button>

<svg viewBox="0 0 24 24">
<circle cx="10" cy="10" r="6"/>
<path d="M14 14L21 21"/>
</svg>

<span>Search</span>

</button>




<button>

<svg viewBox="0 0 24 24">
<path d="M9 18V5L20 3V16"/>
<circle cx="6" cy="18" r="3"/>
<circle cx="17" cy="16" r="3"/>
</svg>

<span>Library</span>

</button>


</nav>



</div>



<script src="script.js"></script>


</body>

</html>
