<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">
    <div class="pulse-logo">
        Pulse
    </div>
</div>




<div class="app">



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>




<div class="time-row">

<span id="current-time">0:00</span>

<span id="duration">3:30</span>

</div>





<div class="progress-container">


<input

class="progress-bar"

type="range"

min="0"

max="210"

value="0"

>


</div>







<div class="controls">



<button class="skip back">


<svg viewBox="0 0 24 24">

<path d="M15 5L7 12L15 19Z"/>

</svg>


</button>







<button class="play-button">


<div class="play-container">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M8 5V19L19 12L8 5Z"/>

</svg>





<svg class="pause-icon" viewBox="0 0 24 24">


<rect
x="7"
y="6"
width="4"
height="12"
rx="2"
/>


<rect
x="13"
y="6"
width="4"
height="12"
rx="2"
/>


</svg>



</div>


</button>







<button class="skip forward">


<svg viewBox="0 0 24 24">


<path d="M9 5L17 12L9 19Z"/>


</svg>


</button>



</div>


</div>


</section>








<section class="page" id="explore">


<h1>Explore</h1>


<div class="music-results">

</div>


</section>







<section class="page" id="search">


<h1>Search</h1>



<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>



<input placeholder="Search songs, artists...">



</div>




<div class="search-results">

</div>



</section>







<section class="page" id="library">


<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>








<nav>


<button class="active">

<svg viewBox="0 0 24 24">

<path d="M4 11L12 4L20 11"/>

<path d="M6 10V20C6 20.6 6.4 21 7 21H17C17.6 21 18 20.6 18 20V10"/>

</svg>

<label>
Home
</label>


</button>







<button>


<svg viewBox="0 0 24 24">

<circle cx="12" cy="12" r="8"/>

<path d="M12 8V12L15 14"/>

</svg>


<label>
Explore
</label>


</button>







<button>


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>


<label>
Search
</label>


</button>







<button>


<svg viewBox="0 0 24 24">

<path d="M9 18V6L18 4V16"/>

<circle cx="6" cy="18" r="3"/>

<circle cx="15" cy="16" r="3"/>

</svg>


<label>
Library
</label>


</button>



</nav>




</div>



<script src="script.js"></script>


</body>

</html>
