<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">

<div class="pulse-logo">
Pulse
</div>

</div>




<div class="app">



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>



<div class="progress">

<div></div>

</div>





<div class="controls">


<button class="skip">

<svg viewBox="0 0 24 24">

<path d="M10 5L3 12L10 19V5Z"/>

<path d="M21 5L14 12L21 19V5Z"/>

</svg>

</button>





<button class="play-button">


<div class="play-container">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M8 6L18 12L8 18Z"/>

</svg>




<svg class="pause-icon" viewBox="0 0 24 24">

<rect x="7" y="6" width="4" height="12" rx="2"/>

<rect x="13" y="6" width="4" height="12" rx="2"/>

</svg>


</div>


</button>





<button class="skip">


<svg viewBox="0 0 24 24">

<path d="M14 5L21 12L14 19V5Z"/>

<path d="M3 5L10 12L3 19V5Z"/>

</svg>

</button>


</div>


</div>


</section>






<section class="page" id="explore">

<h1>Explore</h1>


<div class="music-card">

<h3>Trending Now</h3>

<p>Discover new music</p>

</div>


<div class="music-card">

<h3>Recommended</h3>

<p>Made for you</p>

</div>


</section>







<section class="page" id="search">

<h1>Search</h1>


<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M14 14L21 21"/>

</svg>


<input placeholder="Search songs, artists...">


</div>


</section>







<section class="page" id="library">

<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>






<nav>


<button class="active">

<span>⌂</span>

<label>Home</label>

</button>



<button>

<span>✦</span>

<label>Explore</label>

</button>



<button>

<span>⌕</span>

<label>Search</label>

</button>



<button>

<span>♫</span>

<label>Library</label>

</button>


</nav>



</div>



<script src="script.js"></script>


</body>

</html>
