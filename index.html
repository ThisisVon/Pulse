<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">
    <div class="pulse-logo">Pulse</div>
</div>



<div class="app">


<div class="home-background"></div>



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>



<div class="time-row">

<span id="current-time">0:00</span>

<span id="duration">3:30</span>

</div>



<div class="progress-container">

<input 
type="range"
class="progress-bar"
min="0"
max="210"
value="0"
>

</div>





<div class="controls">



<button class="skip back">

<svg viewBox="0 0 24 24">

<path d="M11 7C11.7 7 12.1 7.8 11.6 8.4L7.8 12L11.6 15.6C12.1 16.2 11.7 17 11 17C10.8 17 10.6 16.9 10.4 16.7L5.5 12C5.2 11.7 5.2 11.3 5.5 11L10.4 7.3C10.6 7.1 10.8 7 11 7Z"/>

<path d="M18 7C18.7 7 19.1 7.8 18.6 8.4L14.8 12L18.6 15.6C19.1 16.2 18.7 17 18 17C17.8 17 17.6 16.9 17.4 16.7L12.5 12C12.2 11.7 12.2 11.3 12.5 11L17.4 7.3C17.6 7.1 17.8 7 18 7Z"/>

</svg>

</button>






<button class="play-button">

<div class="play-container">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M9 7C9 6.2 9.9 5.8 10.6 6.3L17.2 11C17.8 11.5 17.8 12.5 17.2 13L10.6 17.7C9.9 18.2 9 17.8 9 17V7Z"/>

</svg>



<svg class="pause-icon" viewBox="0 0 24 24">

<rect x="7" y="6" width="4" height="12" rx="2"/>

<rect x="13" y="6" width="4" height="12" rx="2"/>

</svg>


</div>

</button>







<button class="skip forward">

<svg viewBox="0 0 24 24">

<path d="M13 7C12.3 7 11.9 7.8 12.4 8.4L16.2 12L12.4 15.6C11.9 16.2 12.3 17 13 17C13.2 17 13.4 16.9 13.6 16.7L18.5 12C18.8 11.7 18.8 11.3 18.5 11L13.6 7.3C13.4 7.1 13.2 7 13 7Z"/>

<path d="M6 7C5.3 7 4.9 7.8 5.4 8.4L9.2 12L5.4 15.6C4.9 16.2 5.3 17 6 17C6.2 17 6.4 16.9 6.6 16.7L11.5 12C11.8 11.7 11.8 11.3 11.5 11L6.6 7.3C6.4 7.1 6.2 7 6 7Z"/>

</svg>

</button>



</div>


</div>


</section>






<section class="page" id="explore">

<h1>Explore</h1>


<div class="music-card">

<h3>Trending Now</h3>

<p>Discover new music</p>

</div>


<div class="music-card">

<h3>Recommended</h3>

<p>Made for you</p>

</div>

</section>







<section class="page" id="search">

<h1>Search</h1>


<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>


<input placeholder="Search songs, artists...">

</div>


</section>







<section class="page" id="library">


<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>







<nav>


<button class="active">

<svg viewBox="0 0 24 24">

<path d="M4 11L12 4L20 11"/>

<path d="M6 10V20C6 20.6 6.4 21 7 21H17C17.6 21 18 20.6 18 20V10"/>

</svg>

<label>Home</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<circle cx="12" cy="12" r="8"/>

<path d="M12 8V12L15 14"/>

</svg>

<label>Explore</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>

<label>Search</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<path d="M9 18V6L18 4V16"/>

<circle cx="6" cy="18" r="3"/>

<circle cx="15" cy="16" r="3"/>

</svg>

<label>Library</label>

</button>


</nav>


</div>


<script src="script.js"></script>


</body>

</html>
