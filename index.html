<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">
    <div class="pulse-logo">Pulse</div>
</div>



<div class="app">


<div class="home-background"></div>



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>



<div class="time-row">

<span id="current-time">0:00</span>

<span id="duration">3:30</span>

</div>



<div class="progress-container">

<input 
type="range"
class="progress-bar"
min="0"
max="210"
value="0"
>

</div>





<div class="controls">


<button class="skip back">

<svg viewBox="0 0 24 24">

<path d="M11 6L5 12L11 18"/>

<path d="M19 6L13 12L19 18"/>

</svg>

</button>






<button class="play-button">


<div class="play-container">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M9 7C9 6.2 9.9 5.8 10.6 6.3L17.2 11C17.8 11.5 17.8 12.5 17.2 13L10.6 17.7C9.9 18.2 9 17.8 9 17V7Z"/>

</svg>



<svg class="pause-icon" viewBox="0 0 24 24">

<rect x="7" y="6" width="4" height="12" rx="2"/>

<rect x="13" y="6" width="4" height="12" rx="2"/>

</svg>


</div>


</button>






<button class="skip forward">


<svg viewBox="0 0 24 24">

<path d="M13 6L19 12L13 18"/>

<path d="M5 6L11 12L5 18"/>

</svg>


</button>


</div>


</div>


</section>






<section class="page" id="explore">

<h1>Explore</h1>


<div class="music-card">

<h3>Trending Now</h3>

<p>Discover new music</p>

</div>


<div class="music-card">

<h3>Recommended</h3>

<p>Made for you</p>

</div>


</section>







<section class="page" id="search">


<h1>Search</h1>


<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>


<input placeholder="Search songs, artists...">


</div>


</section>







<section class="page" id="library">

<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>








<nav>


<button class="active">


<svg viewBox="0 0 24 24">

<path d="M4 11L12 4L20 11"/>

<path d="M6 10V20C6 20.6 6.4 21 7 21H17C17.6 21 18 20.6 18 20V10"/>

</svg>


<label>Home</label>


</button>







<button>


<svg viewBox="0 0 24 24" class="explore-icon">

<path d="M12 3L21 12L12 21L3 12Z"/>

<path d="M12 8L16 12L12 16L8 12Z"/>

</svg>


<label>Explore</label>


</button>







<button>


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>


<label>Search</label>


</button>







<button>


<svg viewBox="0 0 24 24">

<path d="M9 18V6L18 4V16"/>

<circle cx="6" cy="18" r="3"/>

<circle cx="15" cy="16" r="3"/>

</svg>


<label>Library</label>


</button>


</nav>



</div>


<script src="script.js"></script>

</body>

</html>
