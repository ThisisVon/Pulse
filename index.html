<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="splash">
    <div class="pulse-logo">Pulse</div>
</div>



<div class="app">


<div class="home-background"></div>



<section class="page active-page" id="home">


<div class="player">


<div class="album"></div>


<h2>Song Name</h2>

<p>Artist Name</p>



<div class="time-row">

<span id="current-time">0:00</span>

<span id="duration">3:30</span>

</div>



<div class="progress-container">

<input 
type="range"
class="progress-bar"
min="0"
max="210"
value="0"
>

</div>






<div class="controls">



<button class="skip back">


<svg viewBox="0 0 24 24">


<path d="M11 5C11.7 5 12 5.8 11.5 6.3L6.5 12L11.5 17.7C12 18.2 11.7 19 11 19C10.8 19 10.6 18.9 10.4 18.7L4.4 12.7C4 12.3 4 11.7 4.4 11.3L10.4 5.3C10.6 5.1 10.8 5 11 5Z"/>


<path d="M18 5C18.7 5 19 5.8 18.5 6.3L13.5 12L18.5 17.7C19 18.2 18.7 19 18 19C17.8 19 17.6 18.9 17.4 18.7L11.4 12.7C11 12.3 11 11.7 11.4 11.3L17.4 5.3C17.6 5.1 17.8 5 18 5Z"/>


</svg>


</button>






<button class="play-button">


<div class="play-container">


<svg class="play-icon" viewBox="0 0 24 24">

<path d="M9 7C9 6.2 9.9 5.8 10.6 6.3L17.2 11C17.8 11.5 17.8 12.5 17.2 13L10.6 17.7C9.9 18.2 9 17.8 9 17V7Z"/>

</svg>




<svg class="pause-icon" viewBox="0 0 24 24">

<rect x="7" y="6" width="4" height="12" rx="2"/>

<rect x="13" y="6" width="4" height="12" rx="2"/>

</svg>


</div>


</button>






<button class="skip forward">


<svg viewBox="0 0 24 24">


<path d="M13 5C12.3 5 12 5.8 12.5 6.3L17.5 12L12.5 17.7C12 18.2 12.3 19 13 19C13.2 19 13.4 18.9 13.6 18.7L19.6 12.7C20 12.3 20 11.7 19.6 11.3L13.6 5.3C13.4 5.1 13.2 5 13 5Z"/>


<path d="M6 5C5.3 5 5 5.8 5.5 6.3L10.5 12L5.5 17.7C5 18.2 5.3 19 6 19C6.2 19 6.4 18.9 6.6 18.7L12.6 12.7C13 12.3 13 11.7 12.6 11.3L6.6 5.3C6.4 5.1 6.2 5 6 5Z"/>


</svg>


</button>



</div>


</div>


</section>








<section class="page" id="explore">


<h1>Explore</h1>


<div class="music-card">

<h3>Trending Now</h3>

<p>Discover new music</p>

</div>



<div class="music-card">

<h3>Recommended</h3>

<p>Made for you</p>

</div>


</section>







<section class="page" id="search">


<h1>Search</h1>


<div class="search-box">


<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>


<input placeholder="Search songs, artists...">


</div>


</section>







<section class="page" id="library">


<h1>Library</h1>


<div class="music-card">

<h3>Your Music</h3>

<p>Your saved songs appear here</p>

</div>


</section>







<nav>


<button class="active">

<svg viewBox="0 0 24 24">

<path d="M4 11L12 4L20 11"/>

<path d="M6 10V20C6 20.6 6.4 21 7 21H17C17.6 21 18 20.6 18 20V10"/>

</svg>

<label>Home</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<circle cx="12" cy="12" r="8"/>

<path d="M12 8V12L15 14"/>

</svg>

<label>Explore</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<circle cx="10" cy="10" r="6"/>

<path d="M15 15L21 21"/>

</svg>

<label>Search</label>

</button>






<button>

<svg viewBox="0 0 24 24">

<path d="M9 18V6L18 4V16"/>

<circle cx="6" cy="18" r="3"/>

<circle cx="15" cy="16" r="3"/>

</svg>

<label>Library</label>

</button>


</nav>



</div>


<script src="script.js"></script>


</body>

</html>
